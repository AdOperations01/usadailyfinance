name: Safe Hostinger deployment
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run dry-run first and review every changed file before apply
        type: choice
        options: [dry-run, apply]
        default: dry-run
permissions:
  contents: read
concurrency:
  group: hostinger-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Preview or deploy website contents
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          DEPLOY_MODE: ${{ inputs.mode }}
        run: bash scripts/deploy-hostinger.sh
      - name: Remove runner SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
