<script type="text/javascript" id="cf_offer_redirect">
(function () {
    var CLICK_URL = "https://globalvisitclub.com/cf/click/1";

    var fired = false;

    function go(li) {
        if (fired) return;
        fired = true;
        li.classList.add("f-selected");   /* visual ack before unload */
        window.location.href = CLICK_URL;
    }

    function hit(e) {
        var t = e.target;
        if (!t || !t.closest) return null;
        return t.closest(".f-radios-wrap li");
    }

    document.addEventListener("click", function (e) {
        var li = hit(e);
        if (!li) return;
        e.preventDefault();
        e.stopPropagation();
        go(li);
    }, true);

    document.addEventListener("keyup", function (e) {
        if (e.key !== "Enter" && e.key !== " ") return;
        var li = hit(e);
        if (!li) return;
        e.preventDefault();
        e.stopPropagation();
        go(li);
    }, true);
})();
</script>
