  font-weight: 900;

/* Content */
.content { padding: 28px 24px 34px; }

.intro h1 {

  text-align: center;

.trust {

/* Buttons */
.start-btn, .option, .call-btn {
  width: 100%;
  padding: 15px;
  border-radius: 12px;
  border: none;
  font-weight: 700;
  font-size: 16px;
  cursor: pointer;
  transition: .2s ease;
}

.option { background: #1e3a8a; color: white; margin-bottom: 10px; }
.start-btn:hover, .option:hover, .call-btn:hover { transform: translateY(-2px); }

.note {
  text-align: center;
  font-size: 12px;
  color: #64748b;
  margin-top: 8px;
}

/* Quiz */
.progress {
  height: 6px;
  background: #e2e8f0;
  border-radius: 999px;
  overflow: hidden;
  margin-bottom: 16px;
}
.progress span {
  display: block;
  height: 100%;
  width: 0;
  background: #16a34a;
  transition: width .4s ease;
}
.question {
  font-size: 18px;
  font-weight: 700;
  text-align: center;
  margin-bottom: 14px;
}

.status {
  text-align: center;
  font-weight: 600;
  margin-bottom: 14px;
}
.loader {
  width: 100%;
  height: 8px;
  background: #e2e8f0;
  border-radius: 999px;
  overflow: hidden;
}
.loader span {
  display: block;
  height: 100%;
  width: 0;
  background: #16a34a;
  animation: load 3s linear forwards;
}
@keyframes load { to { width: 100% } }

.call-btn {
  display: block;
  text-align: center;
  background: #16a34a;
  color: white;
  text-decoration: none;
  margin-top: 10px;
}
.small {
  font-size: 11px;
  color: #64748b;
  text-align: center;
  margin-top: 6px;
}

<body>

<div class="app">

  <div class="header">
    <div class="logo">
      <div class="logo-icon">★</div>
      DebtReliefStar
    </div>
  </div>

  <div class="content">

    <div id="start-screen" class="intro">
      <h1>Check Your Debt Relief Options</h1>
      <p>Programs are available to help reduce high-interest debt — Answer a few questions to see what options may be available to you today.</p>
      <div class="trust">
        <div>No Fees</div>
        <div>Secure</div>
        <div>Confidential</div>
      </div>
      <button class="start-btn" onclick="start()">Start Free Qualification</button>
      <div class="note">No impact to your credit score</div>
    </div>

    <div id="quiz" style="display:none">
      <div class="progress"><span id="bar"></span></div>
      <div id="content"></div>
    </div>

  </div>
</div>

<script>
const PHONE = "+1-8773-480-120";
let step = 0;

const flow = [
  {q:"Total credit card debt?",o:["$7,500–$15,000","$15,000–$25,000","$25,000+","Not sure"]},
  {q:"Are you behind on payments?",o:["Yes","Almost","No"]},
  {review:true}
];

function start(){
  document.getElementById("start-screen").style.display="none";
  document.getElementById("quiz").style.display="block";
  render();
}

function render(){
  const c=document.getElementById("content");
  document.getElementById("bar").style.width=((step/flow.length)*100)+"%";
  c.innerHTML="";
  if(flow[step].review){showReview();return;}
  c.innerHTML=`<div class="question">${flow[step].q}</div>`;
  flow[step].o.forEach(v=>{
    const b=document.createElement("button");
    b.className="option";
    b.innerText=v;
    b.onclick=()=>{step++;render();}
    c.appendChild(b);
  });
}

function showReview(){
  const c=document.getElementById("content");
  c.innerHTML=`<div class="status">Reviewing your answers…</div><div class="loader"><span></span></div>`;
  setTimeout(()=>{c.innerHTML=`<div class="status">Checking eligibility…</div><div class="loader"><span></span></div>`;},2000);
  setTimeout(()=>{
    c.innerHTML=`<div class="status">Available specialists found</div>
    <a class="call-btn" href="tel:${PHONE}">+1-8773-480-120</a>
    <div class="small">Speak with a debt relief specialist now</div>`;
    document.getElementById("bar").style.width="100%";
  },4000);
}
</script>

<script>
document.addEventListener('click', function(event) {

    var element = event.target.closest(
        'a[href^="tel:"], button, [role="button"]'
    );

    if (!element) return;

    var text = (element.innerText || element.textContent || '').trim();
    var href = element.getAttribute('href') || '';

    // Detect phone/call buttons
    if (
        href.toLowerCase().startsWith('tel:') ||
        /call|phone|speak|specialist|\+1[\s\d()-]{7,}/i.test(text)
    ) {

        if (typeof fbq === 'function') {
            fbq('track', 'AddToCart');
            console.log('Meta Pixel AddToCart fired - Call Button');
        }

    }

}, true);
</script>
